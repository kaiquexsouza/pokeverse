<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed · PokeVerse</title>
  <meta name="description" content="Comunidade de fãs de Pokémon: jogos, animes, cards e muito mais." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <svg viewBox="0 0 32 32" class="brand-logo" xmlns="http://www.w3.org/2000/svg">
          <path d="M 2 16 A 14 14 0 0 1 30 16 Z" fill="white" />
          <path d="M 2 16 A 14 14 0 0 0 30 16 Z" fill="#FBBF24" />
          <circle cx="16" cy="16" r="14" fill="none" stroke="white" stroke-width="2.5" />
          <line x1="2" y1="16" x2="30" y2="16" stroke="white" stroke-width="2.5" />
          <circle cx="16" cy="16" r="5" fill="white" />
          <circle cx="16" cy="16" r="3" fill="#DC2626" />
        </svg>
        <span class="brand-name font-outfit">Pokeverse</span>
      </a>
      <nav class="nav">
        <a href="index.html#categorias" class="nav-link">Categorias</a>
        <a href="feed.html" class="nav-link nav-link-feed nav-link-active" aria-current="page">Feed</a>
        <div id="nav-auth" class="nav-auth"></div>
      </nav>
    </div>
  </header>

  <main class="feed-page">
    <section class="feed-hero">
      <div class="hero-topbar"></div>
      <div class="container feed-hero-inner">
        <div class="pill pill-red">
          <span class="pulse-dot"></span>
          <span>Comunidade</span>
        </div>
        <h1 class="feed-title font-outfit">O que os treinadores estão <span class="text-red">dizendo.</span></h1>

        <div class="tabs" role="tablist" id="tabs">
          <button type="button" class="tab" role="tab" data-categoria="">Todas</button>
          <button type="button" class="tab" role="tab" data-categoria="jogos">Jogos Pokémon</button>
          <button type="button" class="tab" role="tab" data-categoria="animes">Animes</button>
          <button type="button" class="tab" role="tab" data-categoria="cards">Trading Cards</button>
          <button type="button" class="tab" role="tab" data-categoria="gerais">Assuntos Gerais</button>
        </div>
      </div>
    </section>

    <div class="container feed-container">
      <!-- Caixa de novo post (preenchida pelo feed.js) -->
      <div id="composer"></div>

      <p class="feed-status" id="feed-status" hidden></p>
      <div class="posts" id="posts"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <svg viewBox="0 0 32 32" class="footer-logo" xmlns="http://www.w3.org/2000/svg">
          <path d="M 2 16 A 14 14 0 0 1 30 16 Z" fill="#DC2626" />
          <path d="M 2 16 A 14 14 0 0 0 30 16 Z" fill="#FBBF24" />
          <circle cx="16" cy="16" r="14" fill="none" stroke="#6B7280" stroke-width="2" />
          <line x1="2" y1="16" x2="30" y2="16" stroke="#6B7280" stroke-width="2" />
          <circle cx="16" cy="16" r="5" fill="#6B7280" />
          <circle cx="16" cy="16" r="3" fill="#374151" />
        </svg>
        <span class="footer-name font-outfit">Pokeverse</span>
      </div>

      <div class="socials">
        <button type="button" class="social" aria-label="Twitter">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" /></svg>
        </button>
        <button type="button" class="social" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <button type="button" class="social" aria-label="Discord">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" /></svg>
        </button>
        <button type="button" class="social" aria-label="YouTube">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" /></svg>
        </button>
      </div>

      <p class="copyright">
        © <span id="year"></span> Pokeverse. Todos os direitos reservados.<br />
        <span class="copyright-muted">Não afiliado à Nintendo ou The Pokémon Company.</span>
      </p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script src="feed.js"></script>
</body>
</html>
