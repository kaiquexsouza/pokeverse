# Blueprint do Render: cria o site (Node) e o banco PostgreSQL já conectados.
# No Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: pokeverse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pokeverse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_URL
        value: https://pokeverse-30es.onrender.com
      - key: LAUNCH_AT
        sync: false
      - key: LAUNCH_ADMIN_TOKEN
        generateValue: true
      # Credenciais OAuth2 da Gmail API, preenchidas no painel do Render.
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_USER
        sync: false

databases:
  - name: pokeverse-db
    plan: free
    databaseName: pokeverse
    user: pokeverse
