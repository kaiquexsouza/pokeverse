# Blueprint do Render: cria o site (Node) e o banco PostgreSQL já conectados.
# No Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: pokeverse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pokeverse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_URL
        value: https://pokeverse-30es.onrender.com
      - key: LAUNCH_ADMIN_TOKEN
        generateValue: true
      # Preencha estas variáveis no painel do Render usando o seu provedor SMTP.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: pokeverse-db
    plan: free
    databaseName: pokeverse
    user: pokeverse
